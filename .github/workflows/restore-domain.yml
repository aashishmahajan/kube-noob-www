name: restore-domain

# The 2026-11-04 publish left Pages with cname null, so kube-noob.com returns GitHub's
# "Site not found" while kube-noob.github.io/kube-noob-www still serves the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/restore-domain.yml"]

permissions:
  pages: write
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Attach kube-noob.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f cname=kube-noob.com --jq '{cname,status,html_url}'
